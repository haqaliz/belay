[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The PyPI distribution name is `belay-harness` because `belay` is already taken on
# PyPI (an unrelated MicroPython tool). The import package and the CLI stay `belay`:
#   pip install belay-harness   ->   belay --help   /   import belay
name = "belay-harness"
version = "0.30.0"
description = "The agent harness: sandbox any agent, verify each step by replaying it against real state, and keep a deterministic trace."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ali Haqiqi" }]
keywords = [
    "agent",
    "harness",
    "mcp",
    "sandbox",
    "replay",
    "verification",
    "observability",
    "llm",
    "ai-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Zero runtime dependencies — stdlib only. This is a deliberate, load-bearing property.
dependencies = []

[project.urls]
Homepage = "https://github.com/haqaliz/belay"
Repository = "https://github.com/haqaliz/belay"
Issues = "https://github.com/haqaliz/belay/issues"
Changelog = "https://github.com/haqaliz/belay/blob/master/CHANGELOG.md"

[project.scripts]
belay = "belay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "mcp==1.28.1",
    # Test-only, and only for `tests/test_release_workflow.py`: the release
    # pipeline's guard parses `.github/workflows/release.yml` STRUCTURALLY. A
    # hand-rolled scan of YAML text is how a guard against "ship an artifact
    # nothing checked" comes to pass vacuously. Never imported by src/belay —
    # the zero-runtime-dependency contract is unchanged and still enforced by
    # `tests/test_import_guard.py`.
    "pyyaml",
]
eval = [
    "anthropic>=0.117.0",
    "openai>=2.46.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/belay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests/ can `import eval.minting_driver` — `eval/` is a new,
# eval-only top-level tree (not part of the `belay-harness` wheel: see `[tool.hatch.build
# .targets.wheel] packages`), so it is not reachable via the editable install of `belay`.
pythonpath = ["."]
markers = [
    "sdk: uses the real mcp SDK client (dev-only dep)",
    "manual: real model + real npx MCP servers + live spend; never runs in CI, select in with -m manual",
    "install: builds and installs the wheel/sdist and verifies from the installed artifact (the L4 artifact-install acceptance); excluded from the default run, select in with -m install",
]
# `manual`- and `install`-marked tests are excluded from the default run: `manual`
# (the Task 5 minting-driver smoke) spawns real npx MCP servers, spends against a real
# model API, and requires Darwin + Seatbelt; `install` (the L4 artifact-install
# acceptance) builds and installs the wheel, so it is slow. `-m manual` / `-m install`
# on the command line overrides this addopts value, so
# `uv run pytest tests/test_artifact_install.py -m install` still selects it.
addopts = "-m 'not manual and not install'"

[tool.ruff]
# `tests/fixtures/assertions/` is VERBATIM TEST SOURCE lifted out of the audited mint
# captures, not code this repo maintains. Linting it is a category error: the whole reason
# `pylint_5859_t6_*` exists is that a trailing comma is what the Phase-0 audit's closest
# call turned on, and `ruff --fix` would delete exactly that evidence. The files are never
# imported or executed — `belay.verify.assertions.extract` reads their BYTES — so unused
# imports and undefined helper names in them are facts about the captured agent run, not
# defects. Excluded rather than per-rule-ignored because the next fixture will carry some
# other real-world untidiness and must not need a config change to be checked in intact.
#
# `demo/capture/` is the same category and the stronger case: it is a FROZEN RECORDING of
# a real agent run — trace, manifests, and the snapshotted pre-state trees the replay
# restores. Its README says "nothing in here is edited by hand, ever", and a verdict is
# only meaningful because the bytes are the ones the run actually saw. `ruff --fix` on a
# snapshot would silently change what replay re-executes, which is trace tampering by
# linter. (It fires today: the agent's own `l = last_col` is an E741 in
# `snapshots/turn-0006/app.py`.)
extend-exclude = ["tests/fixtures/assertions", "demo/capture"]
