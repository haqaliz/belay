name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (macOS)
    # Belay's sandbox (Seatbelt) and snapshot (APFS clonefile) run here; the
    # seatbelt-pinning and end-to-end replay tests that re-invoke inside the
    # macOS sandbox live here (named-caused gates — see README). Linux runs the
    # same suite in the `test-linux` job below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (dev deps)
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # The full suite on Linux (aspect A4). The linux-gated A2/A3 tests — the
  # Landlock+seccomp escape matrix, the copy-fidelity snapshot round trips, the
  # reflink/collision fixtures — execute for the FIRST time on a real Linux box
  # here, and the ungated sandbox/replay tests exercise the Linux backends on
  # this substrate. Skips are limited to the named-caused gates listed in
  # README's platform coverage section (guarded by
  # tests/test_platform_gate_named_causes.py).
  test-linux:
    name: test (Linux)
    # PINNED image, same rationale as the spike job: the containment claims are
    # about ubuntu-24.04 (kernel measured by the A1 probe), and `ubuntu-latest`
    # is a moving target.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (dev deps)
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # The artifact acceptance (aspect artifact-install-ci, feature pypi-publish):
  # the built wheel and sdist must install and run on the platforms the release
  # claims to support. The module is deselected from the default run
  # (pyproject.toml addopts); this job is the ONLY run of
  # tests/test_artifact_install.py (selected with -m install).
  install:
    name: install (${{ matrix.os }})
    # PINNED ubuntu-24.04, same rationale as the test-linux job: the installed
    # artifact's substrate claims are about the release the wheel was built on,
    # and `ubuntu-latest` is a moving target. macos-latest is the macOS path
    # (the sandbox's Seatbelt backend lives there).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # No separate `uv build --wheel` step: the module's session fixture
      # rebuilds the wheel and sdist from this checkout itself (the docker job
      # comment above is the same pattern) — a stale dist/ artifact would fail
      # the version-stamp test, asserted not assumed.
      - name: Test the installed artifact
        run: uv run pytest tests/test_artifact_install.py -m install -q

  # The self-host image (docs/planning/docker-selfhost/): build it from THIS
  # checkout, hold it to the documented contract (tests/test_docker_image.py, A1),
  # and re-measure Belay's substrate INSIDE the container
  # (tests/test_docker_inimage.py, A2 — the whole suite, `belay sandbox check`,
  # and a capture -> verify roundtrip generated in-container), and the compose
  # path (tests/test_docker_compose.py).
  #
  # This job is the LINUX-HOST half of the claim split: the container's kernel is
  # this pinned runner's, so what it asserts is a fact about ubuntu-24.04 and
  # nothing else. The macOS-host path (Docker Desktop's Linux VM kernel) is a
  # different substrate; it stays a manual operator re-probe, documented in
  # README, and is never asserted here.
  #
  # Docker is preinstalled on GitHub's ubuntu runners — no setup step.
  docker:
    name: docker (image build + in-image acceptance)
    # PINNED image, same rationale as the test-linux and spike jobs: the
    # image's substrate claims are ubuntu-24.04-shaped, and `ubuntu-latest`
    # is a moving target.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (dev deps)
        run: uv sync

      # No separate `uv build --wheel` step: the module's session fixture
      # rebuilds the wheel from this checkout itself — a stale dist/ wheel
      # would fail the version-stamp test, asserted not assumed — so the
      # wheel the image installs is exactly this PR's.
      - name: Test the docker image
        # Both modules in ONE invocation: the image build is a session-scoped
        # fixture in tests/conftest.py, so a single pytest process builds once and
        # both modules run against the same artifact. Split across two steps and
        # the image would be built twice.
        run: >-
          uv run pytest tests/test_docker_image.py tests/test_docker_inimage.py
          tests/test_docker_compose.py -q

  # The containment spike (aspect A1): measure, on a REAL ubuntu job, which
  # Linux containment mechanisms can enforce Belay's boundary, and emit the
  # machine-readable artifact the written decision cites
  # (docs/planning/linux-sandbox/containment-spike/). This job is the spec's
  # acceptance criterion 1: it fails until the probe exists and runs.
  spike-linux:
    name: spike (linux containment probe)
    # PINNED image. `ubuntu-latest` is a moving target (22.04 -> 24.04 already
    # happened mid-mint); the probe artifact records the image it ran on, and
    # the decision must not be able to drift onto a different substrate.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (dev deps)
        run: uv sync

      # The probe exits 0 when a mechanism is unavailable: `unavailable` IS
      # the measurement (spec criterion 2). This step fails only if the probe
      # itself errors — a crash, or an artifact that fails its own schema.
      - name: Run the containment probe
        run: uv run python eval/linux_probe/probe.py

      - name: Keep the first result for the determinism diff
        run: cp probe_result.json probe_result.first.json

      - name: Upload the probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-probe-result
          path: probe_result.json

      # Spec criterion 3: same image -> byte-identical artifact. The second
      # run overwrites probe_result.json; the first copy is diffed against it.
      - name: Re-run the probe
        run: uv run python eval/linux_probe/probe.py

      - name: "Determinism: the two runs must be byte-identical"
        run: diff probe_result.first.json probe_result.json
