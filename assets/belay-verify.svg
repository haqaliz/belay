<svg xmlns="http://www.w3.org/2000/svg" width="908" height="470" viewBox="0 0 908 470" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <style>
      .b    { font-size: 14px; }
      .lbl  { fill: #8b949e; }
      .txt  { fill: #e6edf3; }
      .grn  { fill: #3fb950; }
      .yel  { fill: #d29922; }
      .cyn  { fill: #39c5cf; }
      .red  { fill: #f85149; }
      .mut  { fill: #6e7681; }
      .cor  { fill: #e76050; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="907" height="469" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 12 a12 12 0 0 1 12 -12 h884 a12 12 0 0 1 12 12 v32 h-908 z" fill="#161b22"/>
  <circle cx="24" cy="22" r="6" fill="#f85149"/>
  <circle cx="44" cy="22" r="6" fill="#d29922"/>
  <circle cx="64" cy="22" r="6" fill="#3fb950"/>
  <text x="454" y="27" text-anchor="middle" class="b mut">belay — a PASS that says exactly what it covers, and what it does not</text>

  <g class="b">
    <text y="76"><tspan x="28" class="cor">$ </tspan><tspan class="txt">belay verify ./traces/run.jsonl --manifest-dir ./snapshots.manifests \</tspan></text>
    <text y="96"><tspan x="44" class="txt">--server node .../server-filesystem ./workspace</tspan></text>

    <text y="132"><tspan x="28" class="mut">1 tool-call turn(s); verifying 1 by re-execution.</tspan></text>

    <text y="170"><tspan x="28" class="grn bold">turn 0</tspan><tspan x="96" class="txt">write_file</tspan><tspan x="264" class="grn bold">PASS</tspan></text>

    <text y="196"><tspan x="60" class="cyn">A2</tspan><tspan x="92" class="lbl">replay</tspan><tspan x="196" class="grn">PASS</tspan><tspan x="268" class="txt">replayed reply reproduced the recorded reply</tspan></text>
    <text y="220"><tspan x="60" class="cyn">A2</tspan><tspan x="92" class="lbl">effect</tspan><tspan x="196" class="grn">PASS</tspan><tspan x="268" class="txt">declared readOnlyHint: false — the observed effect conforms</tspan></text>

    <text y="248"><tspan x="60" class="cyn">A2</tspan><tspan x="92" class="lbl">effect:network</tspan><tspan x="228" class="yel bold">NOT_COVERED</tspan></text>
    <text y="268"><tspan x="268" class="mut">openWorldHint declared false — a promise this run did NOT check.</tspan></text>
    <text y="288"><tspan x="268" class="mut">Belay observes no network egress: never a PASS, never a fabricated FAIL.</tspan></text>

    <text y="316"><tspan x="60" class="cyn">A1</tspan><tspan x="92" class="lbl">invariant</tspan><tspan x="196" class="grn">PASS</tspan><tspan x="268" class="txt">no-assertion-weakening on 'tests' / 'testing'</tspan></text>
    <text y="336"><tspan x="268" class="mut">exposure: 0 file(s) in scope — this carries NO information about the rule.</tspan></text>

    <text y="374"><tspan x="28" class="mut">aggregate</tspan><tspan x="220" class="txt">1 turn verified</tspan><tspan x="380" class="grn">PASS 1</tspan><tspan x="470" class="txt">WARN 0</tspan><tspan x="560" class="txt">FAIL 0</tspan><tspan x="650" class="txt">UNVERIFIED 0</tspan></text>

    <text y="412"><tspan x="28" class="red bold">A `PASS` covers the dimensions Belay checks — the coverage line travels with it.</tspan></text>
    <text y="434"><tspan x="28" class="mut">A1 and A2 consult no model. The verdict is re-execution and a state diff — no LLM.</tspan></text>
    <text y="456"><tspan x="28" class="mut"># real output, run against an off-the-shelf MCP server (@modelcontextprotocol/server-filesystem).</tspan></text>
  </g>
</svg>
