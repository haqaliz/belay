# Belay, self-hosted: the engine and the live console.
#
# Two services on purpose. `docker compose run --rm belay <subcommand>` is exactly
# `docker run --rm belay <subcommand>` — same image, same non-root user, same
# entrypoint — so nothing here is a second way to configure the engine. The
# console is the C7 surface (launch checklist L6): the local-first live run feed,
# built from this checkout and served on the loopback with its own healthcheck.
#
#   docker compose build
#   docker compose run --rm belay --help
#   docker compose run --rm belay sandbox check --scope /workspace
#   docker compose up console      # http://127.0.0.1:8080
#
# The console image BUNDLES the engine — the wheel is built in-image from this
# checkout, mirroring the engine Dockerfile — so verify/replay inside the console
# container run THIS engine, never a stale published wheel.
#
# Kernel requirement, carried from the README: the sandbox is the HOST kernel's
# Landlock (≥ 5.13, LSM enabled). On an older host the launcher refuses with a
# named cause and exit 2 — loudly, never a silent unsandboxed run.

services:
  belay:
    build: .
    # Pinned to the tag the image tests build (tests/conftest.py:DOCKER_IMAGE_TAG),
    # so the compose path and the `docker run` path are one artifact, not two.
    image: belay:test
    # The state mount. Everything Belay reads or writes lives under here, and it
    # stays owned by the host user: the image runs as the non-root `belay` user
    # (uid 1000), and `docker run --user root` is the one-flag opt-in.
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    environment:
      # Where captured traces land. Treat a trace as the credential it may
      # contain: capture is lossless, so tool arguments — keys included — are in
      # it verbatim (README, "A trace is as sensitive as...").
      BELAY_TRACE_DIR: ${BELAY_TRACE_DIR:-/workspace/traces}
      # Where a turn's pre-state snapshots land; the manifests go to a SIBLING
      # directory (`<dir>.manifests`), which is what `belay verify --manifest-dir`
      # wants.
      BELAY_SNAPSHOT_DIR: ${BELAY_SNAPSHOT_DIR:-/workspace/snapshots}
      # The write scope the sandbox enforces. Unset means no sandbox: set it to
      # the tree the server may change, and nothing wider.
      BELAY_SANDBOX_SCOPE: ${BELAY_SANDBOX_SCOPE:-/workspace}
    # No ports, and no docker socket. The engine is a stdio proxy — it listens on
    # nothing — and mounting the daemon socket would hand a contained process the
    # host, which is the opposite of what this image is for.

  # C7 — the live console (launch checklist L6). Built from this checkout
  # (console/Dockerfile), served on the loopback only, with a healthcheck against
  # its /health endpoint. The image bundles the engine (wheel built in-image), so
  # replay-from-here works in-container; the volumes below share the engine's
  # state mount, so the traces and snapshots the engine writes are what the
  # console reads.
  console:
    build:
      # The repo root is the build context: the console image builds the engine
      # wheel IN-IMAGE from this checkout, so the context must carry the engine
      # sources alongside console/.
      context: .
      dockerfile: console/Dockerfile
    ports:
      # Loopback only: the console serves the local network, never the LAN.
      - "127.0.0.1:8080:8080"
    # The same state mount as the engine service: the console reads the traces
    # (BELAY_CONSOLE_TRACE_DIR) and the bundled engine reads the snapshots
    # (BELAY_SNAPSHOT_DIR) from the directories the engine service writes.
    volumes:
      - ./workspace:/workspace
    environment:
      # The trace dir the console reads — the engine service's BELAY_TRACE_DIR
      # default, reached through the shared mount.
      BELAY_CONSOLE_TRACE_DIR: ${BELAY_CONSOLE_TRACE_DIR:-/workspace/traces}
      # The bundled engine's snapshot dir (verify/replay in-container).
      BELAY_SNAPSHOT_DIR: ${BELAY_SNAPSHOT_DIR:-/workspace/snapshots}
      # The server's dev defaults are loopback + 8787; in the container the
      # published port is reached via the container's network interface, so
      # the bind must be 0.0.0.0 and the port the mapping + healthcheck expect.
      BELAY_CONSOLE_PORT: ${BELAY_CONSOLE_PORT:-8080}
      BELAY_CONSOLE_HOST: ${BELAY_CONSOLE_HOST:-0.0.0.0}
    healthcheck:
      # /health answers 200 only when the bundled engine reports its version; a
      # 503 (engine unreportable) reads as unhealthy — the honest state.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
